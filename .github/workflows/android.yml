name: Android app

# Builds the installable app and publishes it as a release of the public update
# repository (UPDATE_REPO). The installed app looks at that repository's latest
# release to find out about updates.
#
# Publishing there needs the secret CHECKUPDATE_TOKEN: a fine-grained GitHub token
# with "Contents: Read and write" on UPDATE_REPO only. Without it, the build is
# published as a release of this repository instead, and installed apps don't see it.

on:
  push:
    paths:
      - "web/**"
      - "assets/**"
      - "scripts/**"
      - "android-signing/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write # to publish the release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      UPDATE_REPO: domas314/Checkupdate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - name: Download the on-device reading engine
        run: npm run engine
      - name: Create the Android project from web/
        run: npm run android:prepare
      - name: Build the APK
        run: npm run android:build
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Notereader.apk && ls -la Notereader.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Notereader-android
          path: Notereader.apk
          compression-level: 0
      - name: Publish the update
        if: github.ref_name == github.event.repository.default_branch
        env:
          CHECKUPDATE_TOKEN: ${{ secrets.CHECKUPDATE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Notereader 1.${BUILD_NUMBER}"
          notes="Download Notereader.apk on your phone and open it to install or update."
          if [ -n "$CHECKUPDATE_TOKEN" ]; then
            GH_TOKEN="$CHECKUPDATE_TOKEN" gh release create "v1.${BUILD_NUMBER}" Notereader.apk \
              --repo "$UPDATE_REPO" --target main --latest --title "$title" --notes "$notes"
            echo "Published to https://github.com/$UPDATE_REPO/releases/tag/v1.${BUILD_NUMBER}"
          else
            echo "::warning title=Update not published to $UPDATE_REPO::Add the CHECKUPDATE_TOKEN secret (see the top of this workflow). Installed apps will not see this build."
            gh release create "v1.${BUILD_NUMBER}" Notereader.apk \
              --target "$GITHUB_SHA" --latest --title "$title" --notes "$notes"
          fi
