name: Android app

on:
  push:
    paths:
      - "web/**"
      - "assets/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write # to attach the APK to a release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - name: Create the Android project from web/
        run: npm run android:prepare
      - name: Build the APK
        run: npm run android:build
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Notereader.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Notereader-android
          path: Notereader.apk
      - name: Publish the APK as the "android-latest" release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest Notereader.apk \
            --target "$GITHUB_SHA" \
            --title "Notereader for Android (latest build)" \
            --notes "Download Notereader.apk on your phone and open it to install. Built from ${GITHUB_SHA::7}."
