name: Android app

# Builds the installable app and publishes it as a release of the public update
# repository (UPDATE_REPO). The installed app looks at that repository's latest
# release to find out about updates.
#
# Publishing there needs the secret CHECKUPDATE_TOKEN: a fine-grained GitHub token
# with "Contents: Read and write" on UPDATE_REPO only. Without it, the build is
# published as a release of this repository instead, and installed apps don't see it.

on:
  push:
    paths:
      - "web/**"
      - "assets/**"
      - "scripts/**"
      - "android-signing/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write # to publish the release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      UPDATE_REPO: domas314/Checkupdate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check the update token
        # Reports where the problem is, without ever printing the token.
        env:
          CHECKUPDATE_TOKEN: ${{ secrets.CHECKUPDATE_TOKEN }}
          SAVED_AS_VARIABLE: ${{ vars.CHECKUPDATE_TOKEN != '' }}
        run: |
          if [ -z "$CHECKUPDATE_TOKEN" ]; then
            if [ "$SAVED_AS_VARIABLE" = "true" ]; then
              echo "::warning title=Update token::CHECKUPDATE_TOKEN is saved as a Variable. Delete it there and add it under Settings > Secrets and variables > Actions > Secrets (Repository secrets)."
            else
              echo "::warning title=Update token::This build cannot see a secret named CHECKUPDATE_TOKEN. Add it in THIS repository under Settings > Secrets and variables > Actions > Repository secrets (not Variables, Environments, Codespaces or Dependabot, and not in $UPDATE_REPO)."
            fi
            exit 0
          fi
          code=$(curl -s -o /tmp/repo.json -w '%{http_code}' -H "Authorization: Bearer $CHECKUPDATE_TOKEN" "https://api.github.com/repos/$UPDATE_REPO")
          if [ "$code" = "401" ]; then
            echo "::warning title=Update token::The CHECKUPDATE_TOKEN secret is found, but GitHub rejects it (revoked, expired or mistyped). Create a new token and save it again."
          elif [ "$code" != "200" ]; then
            echo "::warning title=Update token::The CHECKUPDATE_TOKEN secret is found, but it has no access to $UPDATE_REPO (HTTP $code). Give the token access to that repository."
          elif [ "$(jq -r '.permissions.push' /tmp/repo.json)" != "true" ]; then
            echo "::warning title=Update token::The CHECKUPDATE_TOKEN secret can see $UPDATE_REPO but cannot write to it. Give the token Contents: Read and write."
          else
            echo "::notice title=Update token::CHECKUPDATE_TOKEN works: it can publish releases to $UPDATE_REPO."
          fi
      - run: npm install --no-audit --no-fund
      - name: Download the on-device reading engine
        run: npm run engine
      - name: Create the Android project from web/
        run: npm run android:prepare
      - name: Build the APK
        run: npm run android:build
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Notereader.apk && ls -la Notereader.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Notereader-android
          path: Notereader.apk
          compression-level: 0
      - name: Publish the update
        if: github.ref_name == github.event.repository.default_branch
        env:
          CHECKUPDATE_TOKEN: ${{ secrets.CHECKUPDATE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Notereader 1.${BUILD_NUMBER}"
          notes="Download Notereader.apk on your phone and open it to install or update."
          if [ -n "$CHECKUPDATE_TOKEN" ]; then
            GH_TOKEN="$CHECKUPDATE_TOKEN" gh release create "v1.${BUILD_NUMBER}" Notereader.apk \
              --repo "$UPDATE_REPO" --target main --latest --title "$title" --notes "$notes"
            echo "Published to https://github.com/$UPDATE_REPO/releases/tag/v1.${BUILD_NUMBER}"
          else
            echo "::warning title=Update not published to $UPDATE_REPO::Add the CHECKUPDATE_TOKEN secret (see the top of this workflow). Installed apps will not see this build."
            gh release create "v1.${BUILD_NUMBER}" Notereader.apk \
              --target "$GITHUB_SHA" --latest --title "$title" --notes "$notes"
          fi
